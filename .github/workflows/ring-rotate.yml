name: ring-rotate
# Moves the patch rings forward, validates the playbook, opens a PR, and (optionally) merges it.
#   Weekly (Monday):  ring0-pilot -> today, ring1-early -> ring0's old date, ring2-broad -> ring1's old date
#                     so each snapshot soaks one week in pilot and one week in early before everyone gets it.
#   Manual run options:
#     emergency: all three rings -> today (urgent CVE)
#     force:     rotate even if ring0 moved less than 6 days ago (testing)
#
# Auto-merge: set repository variable RING_AUTO_MERGE = true
#   (Settings > Secrets and variables > Actions > Variables). Unset/false = PR waits for a human.
#
# One-time repo setting: Settings > Actions > General > Workflow permissions >
#   "Read and write" + "Allow GitHub Actions to create and approve pull requests".

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC (09:00 Toronto in summer, 08:00 in winter)
  workflow_dispatch:
    inputs:
      emergency:
        description: "Move ALL rings to today (urgent fix)"
        type: boolean
        default: false
      force:
        description: "Rotate even if the last rotation was under 6 days ago (testing)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ring-rotate
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compute new ring dates
        id: dates
        env:
          EMERGENCY: ${{ inputs.emergency || false }}
          FORCE: ${{ inputs.force || false }}
        run: |
          python3 - <<'PY'
          import os, re, datetime
          p = "group_vars/all.yml"
          s = open(p).read()
          def get(ring):
              return re.search(rf'^\s+{ring}:\s*"([0-9]{{8}}T[0-9]{{6}}Z)"', s, re.M).group(1)
          now = datetime.datetime.now(datetime.timezone.utc)
          today = now.strftime("%Y%m%dT000000Z")
          r0 = get("ring0-pilot")
          age = (now - datetime.datetime.strptime(r0, "%Y%m%dT%H%M%SZ").replace(tzinfo=datetime.timezone.utc)).days
          emergency = os.environ.get("EMERGENCY") == "true"
          force = os.environ.get("FORCE") == "true"
          if not emergency and not force and age < 6:
              print(f"ring0 moved {age} day(s) ago; skipping to protect soak time (use force to override)")
              raise SystemExit(0)
          if emergency:
              # Current time, not midnight: the urgent fix may have been published earlier today.
              stamp = now.strftime("%Y%m%dT%H%M%SZ")
              new = {"ring0-pilot": stamp, "ring1-early": stamp, "ring2-broad": stamp}
          else:
              new = {"ring0-pilot": today, "ring1-early": r0, "ring2-broad": get("ring1-early")}
          for ring, date in new.items():
              s = re.sub(rf'^(\s+{ring}:\s*)"[^"]*"', rf'\g<1>"{date}"', s, flags=re.M)
          open(p, "w").write(s)
          print(new)
          PY
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # PRs opened with GITHUB_TOKEN do not trigger other workflows, so validate here before merging.
      - name: Validate playbook
        if: steps.dates.outputs.changed == 'true'
        run: |
          pipx install ansible-core
          ansible-playbook -i localhost, --syntax-check local.yml

      - name: Open pull request
        id: pr
        if: steps.dates.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="ring-rotate-$(date -u +%Y%m%d-%H%M)"
          git config user.name  "ring-rotate[bot]"
          git config user.email "ring-rotate@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Rotate patch rings ($(date -u +%F))"
          git push -u origin "$branch"
          url=$(gh pr create --base main --head "$branch" \
            --title "Rotate patch rings ($(date -u +%F))" \
            --body "$(git diff HEAD~1 -- group_vars/all.yml | grep '^[-+] ')")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Opened $url"

      - name: Auto-merge
        if: steps.dates.outputs.changed == 'true' && vars.RING_AUTO_MERGE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.pr.outputs.url }}" --squash --delete-branch
