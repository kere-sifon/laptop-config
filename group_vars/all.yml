---
# Lab safety switch: leave false until the base role is proven, then flip to true in a commit.
patching_enabled: true

# Ring -> Ubuntu snapshot date. A promotion is a one-line change here.
ring_snapshots:
  ring0-pilot: "20261026T000000Z"
  ring1-early: "20261020T002746Z"
  ring2-broad: "20261020T002746Z"
default_ring: ring2-broad

# Removed if found. 'ansible' = full community bundle (universe, ESM-only fixes, ~35 CVEs);
# ansible-pull only needs ansible-core, which stays.
banned_packages:
  - ansible

# Small, visible proof that config from Git lands on the laptop.
base_packages:
  - ubuntu-server   # the build's metapackage; on Dell laptops use ubuntu-desktop (+ Dell OEM meta)
  - htop
  - jq
  - curl
  - tree
  - terraform       # from HashiCorp's apt repo (added in roles/base); not covered by the snapshot pin

# Desktop layer (roles/desktop): GNOME + dev/collab apps from the provisioning package.
# On for every host in this test; set false to keep a host on plain Server.
desktop_enabled: true

desktop_packages:
  - ubuntu-desktop-minimal   # Dell laptops: ubuntu-desktop + Dell OEM meta instead
  - gdm3

desktop_force_xorg: true     # WaylandEnable=false in GDM, as module 05 does

desktop_apt_apps:            # Ubuntu archive, so the ring snapshot pin covers them
  - wireshark
  - docker.io

desktop_snaps:
  - { name: code, classic: true }   # VS Code
  - { name: teams-for-linux }
  - { name: vlc }

desktop_debs:                # vendor downloads, installed only if missing
  - { name: google-chrome-stable, url: "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb" }
  - { name: zoom, url: "https://zoom.us/client/latest/zoom_amd64.deb" }
