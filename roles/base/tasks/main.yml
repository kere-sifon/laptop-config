---
- name: Ensure /etc/zt exists
  ansible.builtin.file:
    path: /etc/zt
    state: directory
    mode: "0755"

- name: HashiCorp apt repository (terraform)
  ansible.builtin.deb822_repository:
    name: hashicorp
    types: deb
    uris: https://apt.releases.hashicorp.com
    suites: "{{ ansible_distribution_release }}"
    components: main
    architectures: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    signed_by: https://apt.releases.hashicorp.com/gpg
  register: hashicorp_repo

- name: Refresh apt after adding the repo
  ansible.builtin.apt:
    update_cache: true
  when: hashicorp_repo.changed

- name: Packages that must not be present
  ansible.builtin.apt:
    name: "{{ banned_packages }}"
    state: absent
    purge: true

- name: Baseline packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Login banner shows the laptop is managed (visible proof of a pull)
  ansible.builtin.copy:
    dest: /etc/update-motd.d/99-zt-managed
    mode: "0755"
    content: |
      #!/bin/sh
      echo
      echo "This laptop is managed by Celestica IT (ansible-pull)."
      [ -f /etc/zt/ansible-state.json ] && echo "Last applied: $(cat /etc/zt/ansible-state.json)"
